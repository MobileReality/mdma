# The organization restricts third-party OAuth apps, so interactive `mcp-publisher login github`
# cannot see the organization. OIDC derives the right to io.github.MobileReality/* from the
# repository owner instead.
# The mcp-publisher version and sha256 are pinned on purpose and must be bumped together.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check manifest versions match package.json
        run: |
          expected=$(node -p "require('./packages/mcp/package.json').version")
          server=$(node -p "require('./packages/mcp/server.json').version")
          server_package=$(node -p "require('./packages/mcp/server.json').packages[0].version")
          manifest=$(node -p "require('./packages/mcp/manifest.json').version")
          status=0
          for pair in "server.json version=$server" "server.json packages[0].version=$server_package" "manifest.json version=$manifest"; do
            label=${pair%=*}
            actual=${pair##*=}
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label is $actual but packages/mcp/package.json is $expected"
              status=1
            fi
          done
          exit $status

      - name: Install mcp-publisher
        env:
          version: v1.8.1
          sha256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          curl -fsSLo "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/${version}/mcp-publisher_linux_amd64.tar.gz"
          echo "${sha256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_PATH"

      - name: Log in to the registry with GitHub OIDC
        working-directory: packages/mcp
        run: mcp-publisher login github-oidc

      - name: Publish
        working-directory: packages/mcp
        run: mcp-publisher publish

# MDMA Author Prompt — Gemma 4 evaluation
#
# Dedicated Gemma eval. Pick the model in the `providers` block below by
# commenting/uncommenting — that is the only knob you normally touch.
#
# Generated outputs are written to the scoped `gemma/` directory
# (gemma/results.json) — kept out of the root `evals/results*.json` gitignore
# so they can be committed and reused by downstream projects.
#
# Run:  pnpm --filter @mobile-reality/mdma-evals eval:gemma
# View: pnpm --filter @mobile-reality/mdma-evals eval:view

description: MDMA Author Prompt Eval — Gemma 4

envPath: .env
outputPath: gemma/results.json

prompts:
  - file://prompt.mjs

providers:
  # Gemma 4 via OpenRouter (uses OPENROUTER_API_KEY). Leave exactly one model
  # uncommented; comment the others.
  #
  # max_tokens / max_completion_tokens lifted above the 1024 default because
  # multi-component test cases truncate mid-component otherwise.
  - id: openrouter:google/gemma-4-26b-a4b-it # 26B MoE (~4B active)
    config:
      max_tokens: 8192
      max_completion_tokens: 8192
  # 31B dense flagship — swap by commenting the block above and uncommenting:
  # - id: openrouter:google/gemma-4-31b-it
  #   config:
  #     max_tokens: 8192
  #     max_completion_tokens: 8192

defaultTest:
  assert:
    # Every test case runs the MDMA validator as a baseline check
    - type: javascript
      value: file://assertions/validate-mdma.mjs
      config:
        exclude: [flow-ordering]

tests: tests.yaml

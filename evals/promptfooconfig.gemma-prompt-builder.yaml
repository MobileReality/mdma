# CLI Prompt Builder — Gemma 4 eval
#
# Gemma variant of promptfooconfig.prompt-builder.yaml. Tests the Master
# Prompt's ability to generate correct customPrompt values. Note: the master
# prompt has no Gemma-specific variant (only anthropic/* are tuned), so Gemma
# uses the default MASTER_PROMPT here — consistent with every non-Anthropic
# model. See promptfooconfig.gemma-custom.yaml for the providers rationale.
#
# Run: pnpm --filter @mobile-reality/mdma-evals eval:gemma:prompt-builder

description: CLI Prompt Builder Eval — Gemma 4

envPath: .env
outputPath: gemma/results-prompt-builder.json

prompts:
  - file://prompt-builder.mjs

providers:
  # Gemma 4 via OpenRouter (uses OPENROUTER_API_KEY). Choose model size by
  # comment/uncomment.
  - id: openrouter:google/gemma-4-26b-a4b-it # 26B MoE (~4B active)
    config:
      max_tokens: 8192
      max_completion_tokens: 8192
  # - id: openrouter:google/gemma-4-31b-it
  #   config:
  #     max_tokens: 8192
  #     max_completion_tokens: 8192

defaultTest:
  assert:
    # Every generated customPrompt must use YAML, not JSON
    - type: javascript
      value: file://assertions/yaml-not-json.mjs
    # Validate any embedded mdma blocks are structurally correct MDMA
    - type: javascript
      value: file://assertions/validate-mdma-examples.mjs

tests: tests-prompt-builder.yaml

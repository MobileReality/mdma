# Author suite for our model — DSL port of ../tests.yaml (28 scenarios).
# Each `request` is the scenario expressed as a DSL intent (the input our model
# was trained on), driven by the shared authoring system prompt (prompt-author.mjs).
# The structural assertions are carried over unchanged. Details the DSL can't
# carry (table sortable/filterable, button confirm, approval-gate
# requiredApprovers/allowedRoles, bindings) are filled in by the model.

# 1. Simple contact form
- description: Contact form (DSL)
  vars:
    request: |
      form#contact-form[full-name*:t, email*^:e, message*:ta](action=contact-submitted)
  assert:
    - { type: javascript, value: file://assertions/only-components.mjs, config: { allowed: [form] } }
    - { type: javascript, value: file://assertions/exact-field-count.mjs, config: { expected: 3 } }
    - { type: javascript, value: file://assertions/has-sensitive.mjs }


# 11. Account deletion — danger button
- description: "Danger button (DSL custom prompt)"
  vars:
    customPrompt: |
      You are an account management assistant. When a user wants to delete their
      account, generate the MDMA document for exactly this DSL intent and nothing
      else:

      button#delete-account(text="Delete My Account", action=delete-account-action, variant=danger)
    request: I want to close my account and delete all my data.
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs

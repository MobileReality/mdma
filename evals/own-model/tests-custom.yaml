# 8. Maintenance notice — single callout
- description: "Maintenance callout (DSL custom prompt)"
  vars:
    customPrompt: |
      You are a system status communicator. On a maintenance event, generate
      the MDMA document for exactly this DSL intent and nothing else (fill the
      callout content from the user's message):

      callout#maintenance-notice(variant=warning)
    request: We need to take the payment system offline on Saturday March 8th from 2 AM to 6 AM EST for database migration.
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs
      config:
        allowed: [callout]
    - type: javascript
      value: file://assertions/callout-variant.mjs
      config:
        variant: warning
    - type: not-contains
      value: "type: form"
    - type: not-contains
      value: "type: button"


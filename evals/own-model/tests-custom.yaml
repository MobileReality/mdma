- description: "Onboarding form (DSL custom prompt)"
  vars:
    customPrompt: |
      You are an HR onboarding assistant. When a new hire needs to be set up,
      generate the MDMA document for exactly this DSL intent and nothing else:

      form#new-hire-info[full-name*:t, email*^:e, department:s{engineering|design|marketing|sales|operations}, start-date*:d](action=onboarding-checklist)
    request: We have a new hire starting in the Design department next Monday.
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs
      config:
        allowed: [form]
    - type: javascript
      value: file://assertions/exact-field-count.mjs
      config:
        expected: 4
    - type: javascript
      value: file://assertions/select-has-options.mjs
    - type: javascript
      value: file://assertions/has-sensitive.mjs
    - type: javascript
      value: file://assertions/has-required-fields.mjs
      config:
        min: 3


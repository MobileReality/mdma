# Custom system-prompt scenarios for our model — customPrompt carries DSL.
#
# Same scenarios/assertions as ../tests-custom-prompt.yaml, but each customPrompt
# prescribes the intent in DSL (the INPUT our model was trained on), not an MDMA
# blueprint (the output). The NL request stays as the user message; the model
# combines DSL-grammar rules (system) + the scenario DSL (custom) + the request.

# 1. Bug report form
- description: "Bug report form (DSL custom prompt)"
  vars:
    customPrompt: |
      You are a bug tracking assistant. When a user reports a bug, generate the
      MDMA document for exactly this DSL intent and nothing else:

      form#bug-report[title*:t, severity:s{critical|high|medium|low}, steps*:ta, expected:ta, actual:ta](action=bug-submitted)
    request: I found a bug where the login page crashes after entering my password.
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs
      config:
        allowed: [form]
    - type: javascript
      value: file://assertions/exact-field-count.mjs
      config:
        expected: 5
    - type: javascript
      value: file://assertions/select-has-options.mjs
    - type: javascript
      value: file://assertions/has-required-fields.mjs
      config:
        min: 2
    - type: contains
      value: "type: textarea"


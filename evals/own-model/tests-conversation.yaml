    - { type: javascript, value: file://assertions/select-has-options.mjs }

- description: "Conv2/T2: confirmation callout — no form re-emit (DSL)"
  vars:
    message: |
      callout#ticket-received(variant=info)
  metadata: { conversationId: own-conv-2 }
  assert:
    - { type: javascript, value: file://assertions/only-components.mjs, config: { allowed: [callout] } }
    - { type: javascript, value: file://assertions/callout-variant.mjs, config: { variant: info } }


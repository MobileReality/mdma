# MDMA Author + Custom System Prompt — own model (MDMA-IL)
#
# Same eval the other models run: the `mobile-reality/mdma-il` author prompt
# layered with each test's customPrompt (which prescribes the exact MDMA
# structure), NL request as the user message, output validated against the
# schema. Run SERIALLY (-j 1) — the endpoint scales per-request.
#
# Run (first 10, serial):
#   PROMPTFOO_DISABLE_DATABASE=1 promptfoo eval \
#     -c own-model/promptfooconfig.own-model-custom.yaml --filter-first-n 10 -j 1
# Full suite: pnpm --filter @mobile-reality/mdma-evals eval:own-model:custom

description: MDMA Author + Custom System Prompt Eval — own model

envPath: ../.env
outputPath: own-model/results-custom.json

prompts:
  - file://prompt-custom.mjs

providers:
  - id: "{{ env.OWN_MODEL_PROVIDER or 'openai:chat:mdma-v3' }}"
    config:
      apiBaseUrl: "{{ env.OWN_MODEL_BASE_URL }}"
      apiKey: "{{ env.OWN_MODEL_API_KEY }}"
      # 2048-token served context: author (~350) + customPrompt + request must
      # leave room for output. 1024 is a safe cap for this suite's prompt sizes.
      temperature: 0
      max_tokens: 1024

defaultTest:
  assert:
    - type: javascript
      value: file://assertions/validate-mdma.mjs
      config:
        exclude: [flow-ordering]

tests: ../tests-custom-prompt.yaml

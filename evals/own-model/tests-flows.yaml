# 15. Benefits enrollment — info callout + form with exact id
- description: "Benefits enrollment flow, exact id (DSL)"
  vars:
    customPrompt: |
      You are an employee benefits enrollment assistant (window closes Mar 31,
      2026). Generate the MDMA document for exactly this DSL intent and nothing
      else (keep the form id):

      callout#enrollment-deadline(variant=info)
      form#benefits-enroll-2026-spring[employee-id*:t, health-plan*:s{hmo|ppo|hdhp|waive}, dental-plan*:s{basic|premium|waive}, vision-plan*:s{standard|premium|waive}, dependents-count*:n, hsa-contribution*:n](action=review-benefits-selection)
    request: I want to enroll in this year's health benefits.
  assert:
    - { type: javascript, value: file://assertions/only-components.mjs, config: { allowed: [form, callout] } }

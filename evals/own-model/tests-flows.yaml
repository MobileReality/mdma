# Example-flow custom prompts for our model — customPrompt carries DSL.
# DSL port of ../tests-flows.yaml (15 flows). Each flow's customPrompt keeps its
# persona/context but prescribes the intent in DSL (the input), not an MDMA
# blueprint or NL field list. Reuses the custom builder (prompt-custom.mjs):
# authoring prompt + this customPrompt + NL request. Assertions carried over.

# 1. Contact form
- description: "Contact Form flow (DSL)"
  vars:
    customPrompt: |
      You are a website assistant. When a visitor wants to contact the company,
      generate the MDMA document for exactly this DSL intent and nothing else:

      form#contact-form[full-name*:t, email*^:e, message*:ta](action=contact-submitted)
    request: I'd like to send a message to your support team.
  assert:
    - { type: javascript, value: file://assertions/only-components.mjs, config: { allowed: [form, callout] } }
    - { type: javascript, value: file://assertions/has-sensitive.mjs }
    - { type: javascript, value: file://assertions/has-required-fields.mjs, config: { min: 2 } }

# 2. Bug report — callout + form
- description: "Bug Report flow (DSL)"
  vars:
    customPrompt: |
      You are an engineering support assistant. When a user reports a bug,
      generate the MDMA document for exactly this DSL intent and nothing else:

      callout#pagerduty-reminder(variant=warning)
      form#bug-report-form[title*:t, reporter-email*^:e, severity*:s{P0|P1|P2|P3}, affected-component*:s{frontend|backend|database|auth|payments}, steps-to-reproduce*:ta, expected-behavior*:ta, actual-behavior*:ta](action=triage-bug-report)
    request: The checkout page is showing a 500 error for all users in production.
  assert:
    - { type: javascript, value: file://assertions/only-components.mjs, config: { allowed: [form, callout] } }
    - { type: javascript, value: file://assertions/select-has-options.mjs }
    - { type: javascript, value: file://assertions/has-required-fields.mjs, config: { min: 3 } }


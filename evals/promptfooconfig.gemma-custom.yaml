# MDMA Author + Custom System Prompt — Gemma 4 eval
#
# Gemma variant of promptfooconfig.custom.yaml. Model size is chosen by
# comment/uncomment in the providers block; the system prompt always resolves
# to the google/gemma-4 variant (via the actual provider id). Outputs are
# scoped to gemma/.
#
# Run: pnpm --filter @mobile-reality/mdma-evals eval:gemma:custom

description: MDMA Author + Custom System Prompt Eval — Gemma 4

envPath: .env
outputPath: gemma/results-custom.json

prompts:
  - file://prompt-custom.mjs

providers:
  # Gemma 4 via OpenRouter (uses OPENROUTER_API_KEY). Choose model size by
  # comment/uncomment; the system prompt is always the google/gemma-4 variant.
  - id: openrouter:google/gemma-4-26b-a4b-it # 26B MoE (~4B active)
    config:
      max_tokens: 8192
      max_completion_tokens: 8192
  # - id: openrouter:google/gemma-4-31b-it
  #   config:
  #     max_tokens: 8192
  #     max_completion_tokens: 8192

defaultTest:
  assert:
    - type: javascript
      value: file://assertions/validate-mdma.mjs
      config:
        exclude: [flow-ordering]

tests: tests-custom-prompt.yaml

# ---------------------------------------------------------------------------
# 12. Mixed issues — kitchen sink
# ---------------------------------------------------------------------------
- description: Fixes a document with many different issue types
  vars:
    brokenDocument: |
      # Employee Onboarding

      ```mdma
      type: form
      id: employee_form
      fields:
        - name: full_name
          type: text
          label: TODO
          required: true
        - name: email
          type: email
        - name: department
          type: select
          label: Department
        - name: start_date
          type: date
          label: Start Date
      onSubmit: missing-handler
      ```

      ```mdma
      type: tasklist
      id: onboarding-tasks
      items:
        - id: task-1
          text: Complete HR paperwork
        - id: task-2
          text: Set up workstation
        - id: task-3
          text: Meet team lead
      onComplete: nonexistent-webhook
      ```

      ```mdma
      type: button
      id: employee_form
      variant: primary
      onClick: onboarding-tasks
      ```

      ```mdma
      type: webhook
      id: notify-hr
      url: https://api.example.com/hr
      method: POST
      ```
  assert:
    - type: javascript
      value: file://assertions/fixer-resolves-errors.mjs
    - type: javascript
      value: file://assertions/fixer-preserves-components.mjs
      config:
        min: 4
    - type: javascript
      value: file://assertions/unique-kebab-ids.mjs
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: webhook
          id: notify-hr
          url: https://api.example.com/hr
          method: POST
          trigger: onboarding-tasks
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: tasklist
          id: onboarding-tasks
          onComplete: notify-hr
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: form
          id: employee-form
        hasFields:
          - onSubmit
    - type: icontains
      value: "onAction: onboarding-tasks"


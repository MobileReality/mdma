            - label: Low
              value: low
            - label: Medium
              value: medium
            - label: High
              value: high
        - name: description
          type: textarea
          label: Description
      onSubmit: submit-ticket
      ```

      ```mdma
      type: webhook
      id: ticket-webhook
      url: https://api.example.com/tickets
      method: POST
      body:
        subject: "{{ticket-form.subject}}"
        priority: "{{ticket-form.priority}}"
      ```

      ```mdma
      type: callout
      id: ticket-success
      variant: success
      content: Ticket submitted successfully!
      ```
  assert:
    - type: javascript
      value: file://assertions/fixer-resolves-errors.mjs
    - type: javascript
      value: file://assertions/fixer-preserves-components.mjs
      config:
        min: 3
    - type: icontains
      value: trigger
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: webhook
          id: ticket-webhook
          url: https://api.example.com/tickets
          method: POST
          trigger: ticket-form
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: form
          id: ticket-form
        hasFields:
          - onSubmit


# ---------------------------------------------------------------------------
# 9. Approval-gate field name typos
# ---------------------------------------------------------------------------
- description: Fixes field name typos on approval-gate (roles→allowedRoles, approvers→requiredApprovers)
  vars:
    brokenDocument: |
      # Leave Request

      ```mdma
      type: approval-gate
      id: leave-approval
      title: Manager Approval
      roles:
        - manager
        - hr
      approvers: 2
      onApprove: leave-confirmed
      ```

      ```mdma
      type: callout
      id: leave-confirmed
      variant: success
      content: Your leave request has been approved!
      ```
  assert:
    - type: javascript
      value: file://assertions/fixer-resolves-errors.mjs
    - type: javascript
      value: file://assertions/fixer-preserves-components.mjs
      config:
        min: 2
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: approval-gate
          id: leave-approval
          title: Manager Approval
          requiredApprovers: 2
          allowedRoles:
            - manager
            - hr
          onApprove: leave-confirmed

# ---------------------------------------------------------------------------
# 10. Table data key mismatch + chart axis mismatch
# ---------------------------------------------------------------------------
- description: Fixes table data key mismatch and chart axis errors
  vars:
    brokenDocument: |
      # Sales Report

      ```mdma
      type: table
      id: sales-table
      columns:
        - key: product
          header: Product
        - key: revenue
          header: Revenue
        - key: units
          header: Units Sold
      data:
        - product_name: Widget A
          total_revenue: 50000
          quantity: 120
        - product_name: Widget B
          total_revenue: 32000
          quantity: 85
      ```

      ```mdma
      type: chart
      id: sales-chart
      variant: bar
      data: |
        Month,Revenue,Costs
        Jan,10000,8000
        Feb,12000,9000
        Mar,15000,11000
      xAxis: Date
      yAxis:
        - Profit
        - Expenses
      ```
  assert:
    - type: javascript
      value: file://assertions/fixer-resolves-errors.mjs
    - type: javascript
      value: file://assertions/fixer-preserves-components.mjs
      config:
        min: 2
    - type: icontains
      value: "xAxis: Month"
    - type: icontains
      value: "product:"
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: chart
          id: sales-chart
          variant: bar
          xAxis: Month
          yAxis:
            - Revenue
            - Costs
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: table
          id: sales-table
          columns:
            - key: product
              header: Product
            - key: revenue
              header: Revenue
            - key: units
              header: Units Sold
          data:
            - product: Widget A
              revenue: 50000
              units: 120
            - product: Widget B
              revenue: 32000
              units: 85


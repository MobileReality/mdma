# ---------------------------------------------------------------------------
- description: Fixes webhook trigger and form onSubmit pointing to missing components
  vars:
    brokenDocument: |
      # Support Ticket

      ```mdma
      type: form
      id: ticket-form
      fields:
        - name: subject
          type: text
          label: Subject
          required: true
        - name: priority

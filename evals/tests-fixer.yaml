# ---------------------------------------------------------------------------
# 9. Approval-gate field name typos
# ---------------------------------------------------------------------------
- description: Fixes field name typos on approval-gate (roles→allowedRoles, approvers→requiredApprovers)
  vars:
    brokenDocument: |
      ```mdma
      type: approval-gate
      id: leave-approval
      title: Manager Approval
      roles:
        - manager
        - hr
      approvers: 2
      onApprove: leave-confirmed
      ```
  assert:
    - type: javascript
      value: file://assertions/fixer-resolves-errors.mjs
    - type: javascript
      value: file://assertions/fixer-preserves-components.mjs
      config:
        min: 1
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: approval-gate
          id: leave-approval
          title: Manager Approval
          requiredApprovers: 2
          allowedRoles:
            - manager
            - hr
          onApprove: leave-confirmed

# ---------------------------------------------------------------------------
# 10. Table data key mismatch
# ---------------------------------------------------------------------------
- description: Fixes table data key mismatch (data keys don't match column keys)
  vars:
    brokenDocument: |
      ```mdma
      type: table
      id: sales-table
      columns:
        - key: product
          header: Product
        - key: revenue
          header: Revenue
        - key: units
          header: Units Sold
      data:
        - product_name: Widget A
          total_revenue: 50000
          quantity: 120
        - product_name: Widget B
          total_revenue: 32000
          quantity: 85
      ```
  assert:
    - type: javascript
      value: file://assertions/fixer-resolves-errors.mjs
    - type: javascript
      value: file://assertions/fixer-preserves-components.mjs
      config:
        min: 1
    - type: icontains
      value: "product:"
    - type: javascript
      value: file://assertions/fixer-contains-component.mjs
      config:
        expected: |
          type: table
          id: sales-table
          columns:
            - key: product
              header: Product
            - key: revenue
              header: Revenue
            - key: units
              header: Units Sold
          data:
            - product: Widget A
              revenue: 50000
              units: 120
            - product: Widget B
              revenue: 32000
              units: 85


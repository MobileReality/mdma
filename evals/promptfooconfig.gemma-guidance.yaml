# MDMA Agent Guidance — Gemma 4 eval
#
# Gemma variant of promptfooconfig.guidance.yaml. Tests whether Gemma decides
# to call the generate_mdma tool for document requests. See
# promptfooconfig.gemma-custom.yaml for the providers/prompt rationale.
#
# Run: pnpm --filter @mobile-reality/mdma-evals eval:gemma:guidance

description: MDMA Agent Guidance Eval — Gemma 4

envPath: .env
outputPath: gemma/results-guidance.json

prompts:
  - file://prompt-guidance.mjs

providers:
  # Gemma 4 via OpenRouter (uses OPENROUTER_API_KEY). Choose model size by
  # comment/uncomment; the system prompt is always the google/gemma-4 variant.
  - id: openrouter:google/gemma-4-26b-a4b-it # 26B MoE (~4B active)
    config:
      max_tokens: 8192
      max_completion_tokens: 8192
      # The generate_mdma tool — mirrors the definition in use-agent.ts
      tools:
        - type: function
          function:
            name: generate_mdma
            description: >
              Generate an MDMA Markdown document to present structured
              interactive content to the user. Use this to create forms,
              tables, checklists, approval gates, charts, callouts, and any
              other interactive UI components described in the MDMA spec.
            parameters:
              type: object
              properties:
                document:
                  type: string
                  description: The complete MDMA Markdown document.
              required:
                - document
      tool_choice: auto
  # - id: openrouter:google/gemma-4-31b-it
  #   config:
  #     max_tokens: 8192
  #     max_completion_tokens: 8192
  #     tools:
  #       - type: function
  #         function:
  #           name: generate_mdma
  #           description: >
  #             Generate an MDMA Markdown document to present structured
  #             interactive content to the user.
  #           parameters:
  #             type: object
  #             properties:
  #               document:
  #                 type: string
  #                 description: The complete MDMA Markdown document.
  #             required:
  #               - document
  #     tool_choice: auto

tests: tests-guidance.yaml

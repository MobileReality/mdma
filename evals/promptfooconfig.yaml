# MDMA Author Prompt — promptfoo evaluation config
#
# Run:  pnpm --filter @mobile-reality/mdma-evals eval
# View: pnpm --filter @mobile-reality/mdma-evals eval:view

description: MDMA Author Prompt Eval

envPath: .env
outputPath: results.json

prompts:
  - file://prompt.mjs

providers:
  # Override per run with EVAL_PROVIDER, e.g.:
  #   EVAL_PROVIDER=openai:gpt-4o pnpm eval                                        # uses OPENAI_API_KEY
  #   EVAL_PROVIDER=openrouter:anthropic/claude-sonnet-4 pnpm eval                 # uses OPENROUTER_API_KEY
  #   EVAL_PROVIDER=openrouter:google/gemini-2.5-pro pnpm eval
  #   EVAL_PROVIDER=openrouter:meta-llama/llama-3.3-70b-instruct pnpm eval
  - "{{ env.EVAL_PROVIDER or 'openai:gpt-4.1-mini' }}"

defaultTest:
  assert:
    # Every test case runs the MDMA validator as a baseline check
    - type: javascript
      value: file://assertions/validate-mdma.mjs
      config:
        exclude: [flow-ordering]


tests: tests.yaml

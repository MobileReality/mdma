# MDMA Conversation (Multi-Turn) — Gemma 4 eval
#
# Gemma variant of promptfooconfig.conversation.yaml. See that file and
# promptfooconfig.gemma-custom.yaml for the providers/prompt rationale.
#
# Run: pnpm --filter @mobile-reality/mdma-evals eval:gemma:conversation

description: MDMA Conversation (Multi-Turn) Eval — Gemma 4

envPath: .env
outputPath: gemma/results-conversation.json

prompts:
  - file://prompt-conversation.mjs

providers:
  # Gemma 4 via OpenRouter (uses OPENROUTER_API_KEY). Choose model size by
  # comment/uncomment; the system prompt is always the google/gemma-4 variant.
  - id: openrouter:google/gemma-4-26b-a4b-it # 26B MoE (~4B active)
    config:
      max_tokens: 8192
      max_completion_tokens: 8192
  # - id: openrouter:google/gemma-4-31b-it
  #   config:
  #     max_tokens: 8192
  #     max_completion_tokens: 8192

tests: tests-conversation.yaml

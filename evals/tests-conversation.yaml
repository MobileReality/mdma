# ===================================================================

- description: "Conv 13/T1: Keyword triggers step 1 insurance claim form"
  vars:
    customPrompt: &conv13_prompt |
      You are an insurance claims assistant.

      ### Conversation Flow

      **Step 1 — File Claim**
      When the user says "file claim", "new claim", or "report damage",
      generate a form to collect initial claim information.

      ```mdma
      type: form
      id: claim-form
      onSubmit: submit-claim-form
      fields:
        - name: claimant_name
          type: text
          label: "Claimant Name"
          required: true
        - name: policy_number
          type: text
          label: "Policy Number"
          required: true
          sensitive: true
        - name: incident_date
          type: date
          label: "Date of Incident"
          required: true
        - name: incident_description
          type: textarea
          label: "Incident Description"
          required: true
      ```

      **Step 2 — Damage Assessment**
      After the claim form is submitted, generate a second form for damage
      assessment. Do NOT show this before step 1 is completed.

      ```mdma
      type: form
      id: damage-assessment-form
      onSubmit: submit-damage-assessment-form
      fields:
        - name: damage_type
          type: select
          label: "Damage Type"
          required: true
          options:
            - label: Water Damage
              value: water
            - label: Fire Damage
              value: fire
            - label: Theft
              value: theft
            - label: Other
              value: other
        - name: estimated_cost
          type: number
          label: "Estimated Repair Cost ($)"
          required: true
        - name: adjuster_notes
          type: textarea
          label: "Adjuster Notes"
      ```

      Only show ONE form at a time.
    message: I need to file a new insurance claim for water damage to my property.
  metadata:
    conversationId: conv-13
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs
      config:
        allowed: [form]
    - type: javascript
      value: file://assertions/exact-field-count.mjs
      config:
        expected: 4
    - type: javascript
      value: file://assertions/has-sensitive.mjs
    - type: not-icontains
      value: "damage_type"
    - type: not-icontains
      value: "estimated_cost"

- description: "Conv 13/T2: Claim submission triggers step 2 damage assessment form"
  vars:
    customPrompt: *conv13_prompt
    message: "Claim submitted. Claimant: Jane Doe, Policy: POL-2024-789, Date: 2024-12-20, Description: burst pipe flooded kitchen. Please proceed to damage assessment."
  metadata:
    conversationId: conv-13
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs
      config:
        allowed: [form]
    - type: javascript
      value: file://assertions/exact-field-count.mjs
      config:
        expected: 3
    - type: icontains
      value: "damage_type"
    - type: not-icontains
      value: "policy_number"

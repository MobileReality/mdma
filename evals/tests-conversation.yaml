# ===================================================================
# Conversation 12 — E2E 2-step: KYC form then compliance review form
# Tests that the AI generates the RIGHT form at the RIGHT step.
# ===================================================================

- description: "Conv 12/T1: Keyword triggers step 1 KYC form"
  vars:
    customPrompt: &conv12_prompt |
      You are a KYC verification assistant in the financial services domain.

      ### Conversation Flow

      **Step 1 — Collect Applicant Data**
      When the user says "start KYC", "verify identity", or "new customer verification",
      generate a form to collect applicant information. Do NOT show the compliance review
      form yet — that comes after this form is submitted.

      ```mdma
      type: form
      id: kyc-applicant-form
      onSubmit: submit-kyc-applicant-form
      fields:
        - name: full_name
          type: text
          label: "Full Legal Name"
          required: true
        - name: date_of_birth
          type: date
          label: "Date of Birth"
          required: true
          sensitive: true
        - name: id_number
          type: text
          label: "Government ID Number"
          required: true
          sensitive: true
        - name: email
          type: email
          label: "Email Address"
          required: true
          sensitive: true
      ```

      **Step 2 — Compliance Review**
      After the user submits the applicant form, generate a second form for the
      compliance officer's review. Do NOT show this form before step 1 is completed.

      ```mdma
      type: form
      id: compliance-review-form
      onSubmit: submit-compliance-review-form
      fields:
        - name: reviewer_name
          type: text
          label: "Reviewer Name"
          required: true
        - name: risk_rating
          type: select
          label: "Risk Rating"
          options:
            - label: Low
              value: low
            - label: Medium
              value: medium
            - label: High
              value: high
        - name: review_notes
          type: textarea
          label: "Review Notes"
          required: true
      ```

      Important: Only show ONE form at a time. Step 1 form on keyword trigger,
      step 2 form after step 1 submission.
    message: I need to start KYC for a new customer.
  metadata:
    conversationId: conv-12
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs
      config:
        allowed: [form]
    - type: javascript
      value: file://assertions/exact-field-count.mjs
      config:
        expected: 4
    - type: javascript
      value: file://assertions/has-sensitive.mjs
    - type: not-icontains
      value: "reviewer_name"
    - type: not-icontains
      value: "risk_rating"

- description: "Conv 12/T2: Form submission triggers step 2 compliance review form"
  vars:
    customPrompt: *conv12_prompt
    message: "I've submitted the applicant form. The customer is John Smith, DOB 1985-03-15, ID A12345678, email john@example.com. Please proceed with compliance review."
  metadata:
    conversationId: conv-12
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs
      config:
        allowed: [form]
    - type: javascript
      value: file://assertions/exact-field-count.mjs
      config:
        expected: 3
    - type: icontains
      value: "reviewer_name"
    - type: not-icontains
      value: "id_number"


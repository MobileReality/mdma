# MDMA Conversation Tests
#
# Multi-turn tests where Turn 1 generates the MDMA component(s) prescribed
# by the customPrompt, and later turns simulate end-user follow-up interactions
# (questions, comments, off-topic chat). The MDMA structure must NEVER be
# regenerated or modified by end-user messages on follow-up turns.
#
# IMPORTANT: Each conversation declares its `customPrompt` ONCE on Turn 1
# using a YAML anchor (`&convN_prompt`). Subsequent turns reference it via
# the alias (`*convN_prompt`) — the system prompt stays identical for the
# entire conversation, mirroring how a real chat client works (one stable
# system message + accumulating user/assistant turns). The customPrompt
# anticipates BOTH the initial generation AND the follow-up behavior, so
# the model has to follow the same coherent instruction on every turn.
#
# We verify:
#   - Follow-ups do NOT regenerate MDMA components
#   - No raw YAML leaks into visible prose
#   - The assistant responds conversationally on later turns

# ===================================================================
# Conversation 1 — User asks about the form they see
# ===================================================================

- description: "Conv 1/T1: Generate contact form from blueprint"
  vars:
    customPrompt: &conv1_prompt |
      You are a customer support assistant. When the user asks for a contact form,
      generate exactly this component:

      ```mdma
      type: form
      id: contact-form
      onSubmit: submit-contact-form
      fields:
        - name: full-name
          type: text
          label: "Full Name"
          required: true
        - name: email
          type: email
          label: "Email Address"
          required: true
          sensitive: true
        - name: message
          type: textarea
          label: "Message"
          required: true
      ```

      Generate this form only once when the user first requests it. No buttons,
      callouts, or other components. For any follow-up questions, respond
      conversationally in plain text without regenerating the form.
    message: I need a contact form for our support page.
  metadata:
    conversationId: conv-1
  assert:
    - type: javascript
      value: file://assertions/only-components.mjs
      config:
        allowed: [form]
    - type: javascript
      value: file://assertions/exact-field-count.mjs
      config:
        expected: 3
    - type: javascript
      value: file://assertions/no-yaml-leak.mjs

- description: "Conv 1/T2: User asks about sensitive field — no regeneration"
  vars:
    customPrompt: *conv1_prompt
    message: Why is the email field treated differently from the other fields?
  metadata:
    conversationId: conv-1
  assert:
    - type: javascript
      value: file://assertions/no-mdma-regeneration.mjs
    - type: javascript
      value: file://assertions/no-yaml-leak.mjs

